# Builds Elsewhere for Windows (x64) and packages an installer.
# Runs on pushes to main / windows, on version tags (v0.2.0 ...), or by hand from the Actions tab.
# Version tags also attach the installer to a draft GitHub Release.
name: Windows build

on:
  push:
    branches: [main, windows]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write   # to create the draft release a version tag's installer goes on
    steps:
      # JUCE is a submodule of Tracktion Engine with an SSH URL; CI can only fetch over HTTPS
      - name: Use HTTPS for GitHub submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read version
        shell: bash
        run: echo "ELSEWHERE_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target Elsewhere --parallel

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:ELSEWHERE_VERSION" scripts\windows\Elsewhere.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build\Elsewhere_artefacts\Release\Elsewhere.exe, build\Elsewhere_artefacts\Release\ptformat.dll, build\Elsewhere_artefacts\Release\Licenses -DestinationPath "dist\Elsewhere-$env:ELSEWHERE_VERSION-Windows-Portable.zip"

      # Private repos share a small artifact quota across the account, so branch builds keep theirs
      # for two weeks and tag builds skip it (their files go on the draft release instead)
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: Elsewhere-${{ env.ELSEWHERE_VERSION }}-Windows
          path: dist/*
          retention-days: 14

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
